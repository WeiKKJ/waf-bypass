# =====================================================================
# 瑞数 WAF 取 Token —— Docker Compose
#
# 构建上下文是仓库根目录（context: .）
#
# 【重要】瑞数 Cookie 有效期实测仅 1~3 分钟，
# 独立的「Cookie 供应端 + 长刷新间隔」方案不可靠 —— 刷新周期必然大于有效期。
# 正确做法是**采集与下载放在同一进程/同一次会话内**，遇 412 即现场自愈。
#
# 用法：
#   cp .env.example .env            # 填入 TARGET_URL
#   docker compose up -d api
#
#   curl -G --data-urlencode "url=$TARGET_URL" \
#        http://localhost:8000/fetch -o invoice.pdf
#
# ⚠️ 安全约束：TARGET_URL 一律通过 environment（运行时）传入，
#    **不要**用 build args 烤进镜像 —— ENV 会固化进镜像 config，
#    公开仓库会泄露真实发票 URL 与发票号码。
# =====================================================================

services:
  # ============ HTTP 服务（对外提供接口）============
  # 随用随取：不做定时预采集，收到 412 才现场采集 Cookie
  # 策略：直接 GET → 412 试该域名缓存 Cookie → 仍 412 现场采集一次 → 还失败就放弃
  # 不落盘：PDF 只在内存中返回，Cookie 按域名缓存在进程内存
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: weikkj/waf-api:latest
    environment:
      - WAF_HEAL_TIMEOUT=120
      - WAF_WAIT_MS=14000
    # 浏览器 profile / Chromium 缓存 / fontconfig 缓存全部指向 tmpfs
    # 容器可写层不随调用次数增长
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /root/.cache:size=64m,mode=1777
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Chromium 需要更大的 /dev/shm，否则渲染页面时会崩
    shm_size: "512m"
