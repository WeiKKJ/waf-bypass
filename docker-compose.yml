# 瑞数 WAF 发票抓取 —— Docker Compose
#
# 构建上下文是工作区根目录（context: ..）
#
# 【重要】实测结论：瑞数 Cookie 有效期仅 1~3 分钟，
# 独立的「Cookie 供应端 + 长刷新间隔」方案不可靠 —— 刷新周期必然大于有效期。
# 正确做法是**采集与下载放在同一容器/同一次会话内**，由 http-client.js 的 412 自愈兜底。
#
# 用法：
#   cd waf-bypass
#   cp .env.example .env            # 填入 TARGET_URL
#   docker compose up -d api         # ← 推荐：对外 HTTP 接口
#   docker compose run --rm selfheal # 一次性采集+下载，PDF 落盘
#
# ⚠️ 安全约束：TARGET_URL 一律通过 environment（运行时）传入，
#    **不要**用 build args 烤进镜像 —— ENV 会固化进镜像 config，
#    公开仓库会泄露真实发票 URL 与发票号码。
#
services:
  # ============ FastAPI 服务（对外 HTTP 接口）============
  # 随用随取：不做定时预采集，收到 412 才现场采集 Cookie
  # 策略：直接 GET → 412 试该域名缓存 Cookie → 仍 412 现场采集一次 → 还失败就放弃
  # 不落盘：PDF 只在内存中返回给调用方，Cookie 按域名缓存在进程内存
  # 容器可写层不随调用次数增长
  api:
    build:
      context: ..
      dockerfile: waf-bypass/Dockerfile
      target: api
    image: waf-api:latest
    environment:
      - WAF_HEAL_TIMEOUT=120
    # 浏览器 profile / Chromium 缓存 / fontconfig 缓存 / pycache 全部指向 tmpfs
    # 容器可写层不随调用次数增长
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var/cache/fontconfig:size=16m
      - /app/__pycache__:size=16m
      - /ms-playwright/chromium-1134/chrome-linux/extensions:size=16m
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ============ 一次性自愈下载（命令行批处理用）============
  # 注意：没有定时服务了。定时轮询固定周期反复访问同一域名，
  # 容易被服务端识别为爬虫而加黑，因此改为按需调用 api 服务。
  # 需要批量落盘时可手动执行本服务。
  selfheal:
    build:
      context: ..
      dockerfile: waf-bypass/Dockerfile
      target: selfheal
    image: waf-selfheal:latest
    environment:
      - TARGET_URL=${TARGET_URL}
    volumes:
      - ./out:/app/out
      - ./cookie:/app/cookies
    # 浏览器临时文件走 tmpfs，容器可写层不随运行时间增长
    # （./out 是宿主机挂载卷，PDF 落盘在宿主机，不占容器层）
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var/cache/fontconfig:size=16m
    # 用 entrypoint + shell，让 $TARGET_URL 在容器内展开
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /app/run-selfheal.sh "$$TARGET_URL" /app/out/invoice.pdf

  # ============ 纯 HTTP 版（不含浏览器，最轻量 239MB）============
  # 需要外部提供有效 Cookie（1~3 分钟内使用）。适合 Cookie 由其他系统注入的场景。
  #
  # ⚠️ TARGET_URL 走运行时环境变量（compose 的 environment），不写进镜像。
  #    Cookie 从 ./cookie 目录挂载读取 —— 不烤进镜像（1~3 分钟即失效，且属敏感凭据）。
  http-only:
    build:
      context: ..
      dockerfile: waf-bypass/Dockerfile
      target: http
    image: waf-http:latest
    environment:
      - TARGET_URL=${TARGET_URL}
    volumes:
      - ./cookie:/app/cookies:ro
      - ./out:/app/out
      - ./run-http.sh:/app/run-http.sh:ro
    entrypoint: ["/bin/sh", "/app/run-http.sh"]

